<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="main2.css">
</head>

<body>
    <div id="vanta-bg"></div>

    <div class="sidebar" data-tilt data-tilt-max="2" data-tilt-speed="400" data-tilt-glare="true"
        data-tilt-max-glare="0.1">
        <ul>
            <li><a href="profile.html"><i class="fa-solid fa-user" style="width: 25px;"></i> PROFILE</a></li>
            <li><a href="todo.html"><i class="fa-solid fa-list-check" style="width: 25px;"></i> TO-DO LIST</a></li>
            <li><a href="notes.html"><i class="fa-solid fa-note-sticky" style="width: 25px;"></i> NOTES</a></li>
            <li><a href="calender1.html"><i class="fa-solid fa-calendar" style="width: 25px;"></i> CALENDAR</a></li>
            <li><a href="documents.html"><i class="fa-solid fa-folder-open" style="width: 25px;"></i> DOCUMENTS <i
                        class="fa-solid fa-lock" style="font-size: 10px; opacity: 0.5; margin-left: 5px;"></i></a></li>
        </ul>
    </div>
    <div class="main">
        <div class="navbar">
            <a><i class="fa-solid fa-cubes" style="margin-right: 10px; color: #00f5ff;"></i>My Hub</a>
        </div>

        <br>
        <div class="row 1">
            <div class="cards">

                <div class="card todo-card" data-tilt data-tilt-max="10" data-tilt-speed="400" data-tilt-glare="true"
                    data-tilt-max-glare="0.3" onclick="window.location.href='todo.html'" style="cursor:pointer;">
                    <div class="card-content">
                        <h3>To Do</h3>
                        <i class="fa-solid fa-list-check" style="font-size: 40px; margin-top: 15px; opacity: 0.8;"></i>
                    </div>
                </div>

                <div class="card notes-card" data-tilt data-tilt-max="10" data-tilt-speed="400" data-tilt-glare="true"
                    data-tilt-max-glare="0.3" onclick="window.location.href='notes.html'" style="cursor:pointer;">
                    <div class="card-content">
                        <h3>Notes</h3>
                        <i class="fa-regular fa-note-sticky" style="font-size: 40px; margin-top: 15px; opacity: 0.8;"></i>
                    </div>
                </div>

                <div class="card rates-card" data-tilt data-tilt-max="10" data-tilt-speed="400" data-tilt-glare="true"
                    data-tilt-max-glare="0.3" onclick="window.location.href='documents.html'" style="cursor:pointer;">
                    <div class="card-content">
                        <h3>Documents</h3>
                        <i class="fa-solid fa-folder-open" style="font-size: 40px; margin-top: 15px; opacity: 0.8;"></i>
                    </div>
                </div>

            </div>
        </div>

        <div class="bottom">
                <div class="calendar">
                    <iframe 
                    src="https://calendar.google.com/calendar/embed?src=your_calendar_link"
                    style="border:0" 
                    width="500" 
                    height="300" 
                    frameborder="0" 
                    scrolling="no">
                    </iframe>
                </div>
                <div class="quick-links" data-tilt data-tilt-max="3" data-tilt-speed="400" data-tilt-glare="true" data-tilt-max-glare="0.15">
                    <a href="https://linkedin.com" target="_blank" class="icon linkedin">
                        <i class="fa-brands fa-linkedin"></i>
                        <span>LinkedIn</span>
                    </a>
                    <a href="https://github.com" target="_blank" class="icon github">
                        <i class="fa-brands fa-github"></i>
                        <span>GitHub</span>
                    </a>
                    <a href="https://mail.google.com" target="_blank" class="icon gmail">
                        <i class="fa-solid fa-envelope"></i>
                        <span>Gmail</span>
                    </a>
                    <a href="profile.html" class="icon profile">
                        <i class="fa-solid fa-user"></i>
                        <span>Profile</span>
                    </a>
                </div>
            </div>
    </div>

    <div id="chatbot-container">
        <div id="chat-window" class="chat-window hidden">
            <div class="chat-header">
                <div class="chat-title">
                    <i class="fa-solid fa-sparkles"></i> Gemini AI
                </div>
                <button id="close-chat" class="close-btn"><i class="fa-solid fa-times"></i></button>
            </div>
            <div id="chat-messages" class="chat-messages">
                <div class="message bot">
                    Hi there! I'm Gemini. How can I help you today?
                </div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off">
                <button id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>

        <button id="chatbot-trigger" class="chatbot-btn" data-tilt data-tilt-max="15">
            <i class="fa-solid fa-message"></i>
        </button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
    <script>
        VANTA.NET({
            el: "#vanta-bg",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0x00f5ff,
            backgroundColor: 0x070014,
            points: 15.00,
            maxDistance: 25.00,
            spacing: 20.00
        });
        VanillaTilt.init(document.querySelectorAll(".card"), { max: 10, speed: 400 });
        VanillaTilt.init(document.querySelectorAll(".chatbot-btn"), { max: 15, speed: 400, glare: true, "max-glare": 0.5 });

        const chatbotTrigger = document.getElementById('chatbot-trigger');
        const chatWindow = document.getElementById('chat-window');
        const closeChatBtn = document.getElementById('close-chat');
        const sendBtn = document.getElementById('send-btn');
        const chatInput = document.getElementById('chat-input');
        const chatMessages = document.getElementById('chat-messages');

        function toggleChat() {
            chatWindow.classList.toggle('hidden');
            if (!chatWindow.classList.contains('hidden')) {
                chatInput.focus();
            }
        }

        chatbotTrigger.addEventListener('click', toggleChat);
        closeChatBtn.addEventListener('click', toggleChat);

        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            msgDiv.innerText = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function handleSend() {
            const text = chatInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            chatInput.value = '';
           
            const loadingId = "loader-" + Date.now();
            const loadingDiv = document.createElement('div');
            loadingDiv.classList.add('message', 'bot', 'loading');
            loadingDiv.id = loadingId;
            loadingDiv.innerText = "...";
            chatMessages.appendChild(loadingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch('/api/gemini', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text })
                });

                const data = await response.json();

                const loaderNode = document.getElementById(loadingId);
                if (loaderNode) loaderNode.remove();

                if (response.ok && data.candidates && data.candidates.length > 0) {
                    addMessage(data.candidates[0].content.parts[0].text, 'bot');
                } else {
                    addMessage("Error: " + (data.error?.message || "Failed to fetch response"), 'bot');
                }
            } catch (error) {
                const loaderNode = document.getElementById(loadingId);
                if (loaderNode) loaderNode.remove();
                addMessage("Error: " + error.message, 'bot');
            }
        }

        sendBtn.addEventListener('click', handleSend);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });
    </script>
</body>

</html>
