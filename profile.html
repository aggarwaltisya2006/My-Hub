<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - My Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Outfit', sans-serif;
            color: #fff;
            overflow: hidden;
            display: flex;
        }

        #vanta-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100vh;
            z-index: -1;
        }

        /* ── Sidebar (identical to main.html) ── */
        .sidebar {
            width: 260px;
            height: 100vh;
            background: rgba(10, 10, 25, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px 20px;
            z-index: 1;
            flex-shrink: 0;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 40px 0 0 0;
        }

        .sidebar li { margin-bottom: 20px; }

        .sidebar a {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.7);
            display: block;
            padding: 12px 20px;
            border-radius: 12px;
            transition: all 0.3s ease;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            transform: translateX(5px);
        }

        .sidebar a.active {
            border-left: 3px solid rgba(0, 245, 255, 0.7);
        }

        /* ── Main area ── */
        .main {
            flex: 1;
            padding: 30px 40px;
            height: 100vh;
            overflow-y: auto;
            z-index: 1;
        }

        .navbar {
            width: 100%;
            margin-bottom: 40px;
        }

        .navbar a {
            display: block;
            color: #fff;
            font-size: 32px;
            font-weight: 700;
            text-decoration: none;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(0, 245, 255, 0.5);
        }

        /* ── Profile card (matches .card style) ── */
        .profile-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 520px;
            animation: fadeInUp 0.7s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .profile-card h2 {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 6px 0;
            text-shadow: 0 0 15px rgba(0, 245, 255, 0.4);
        }

        .profile-card .subtitle {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            font-weight: 300;
            margin: 0 0 30px 0;
        }

        /* ── Form fields ── */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 22px;
        }

        .form-group label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
        }

        .form-group input {
            width: 100%;
            padding: 13px 18px;
            font-size: 15px;
            font-family: 'Outfit', sans-serif;
            color: #fff;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder { color: rgba(255, 255, 255, 0.28); }

        .form-group input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(0, 245, 255, 0.5);
            box-shadow: 0 0 18px rgba(0, 245, 255, 0.15);
        }

        /* ── Submit & Reset buttons ── */
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .submit-btn, .reset-btn {
            flex: 1;
            padding: 15px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .submit-btn {
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: linear-gradient(135deg, rgba(0, 153, 255, 0.5), rgba(0, 245, 255, 0.5));
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, rgba(0, 153, 255, 0.8), rgba(0, 245, 255, 0.8));
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 15px 40px rgba(0, 245, 255, 0.5);
            transform: translateY(-3px) scale(1.02);
        }

        .reset-btn {
            border: 1px solid rgba(255, 100, 112, 0.4);
            color: #ff6b81;
            background: rgba(255, 100, 112, 0.05);
        }

        .reset-btn:hover {
            background: rgba(255, 100, 112, 0.2);
            box-shadow: 0 15px 40px rgba(255, 100, 112, 0.3);
            transform: translateY(-3px) scale(1.02);
            color: #fff;
        }

        .submit-btn:active, .reset-btn:active {
            transform: scale(0.97);
        }

        /* ── Scrollbar ── */
        .main::-webkit-scrollbar { width: 6px; }
        .main::-webkit-scrollbar-track { background: transparent; }
        .main::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        .main::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>

<body>

    <div id="vanta-bg"></div>

    <!-- Sidebar (identical to main.html) -->
    <div class="sidebar">
        <ul>
            <li><a href="profile.html" class="active"><i class="fa-solid fa-user" style="width:25px;"></i> PROFILE</a></li>
            <li><a href="todo.html"><i class="fa-solid fa-list-check" style="width:25px;"></i> TO-DO LIST</a></li>
            <li><a href="notes.html"><i class="fa-solid fa-note-sticky" style="width:25px;"></i> NOTES</a></li>
            <li><a href="calender1.html"><i class="fa-solid fa-calendar" style="width:25px;"></i> CALENDAR</a></li>
            <li><a href="documents.html"><i class="fa-solid fa-folder-open" style="width:25px;"></i> DOCUMENTS
                <i class="fa-solid fa-lock" style="font-size:10px; opacity:0.5; margin-left:5px;"></i></a></li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main">
        <div class="navbar">
            <a href="main.html">My Hub</a>
        </div>

        <div class="profile-card">
            <h2>Profile Information</h2>
            <p class="subtitle">Your account details</p>

            <form id="profileForm">
                <div class="form-group">
                    <label for="name"><i class="fa-solid fa-user" style="margin-right:5px;"></i> Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Your full name" required>
                </div>
                <div class="form-group">
                    <label for="email"><i class="fa-solid fa-envelope" style="margin-right:5px;"></i> Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="phone"><i class="fa-solid fa-phone" style="margin-right:5px;"></i> Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="+91 XXXXX XXXXX">
                </div>
                <div class="btn-group">
                    <button type="submit" class="submit-btn">Save</button>
                    <button type="button" class="reset-btn" id="resetProfileBtn">Reset</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>

    <script>
        // ── Vanta background (same config as main.html) ──
        VANTA.NET({
            el: "#vanta-bg",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0x00f5ff,
            backgroundColor: 0x070014,
            points: 15.00,
            maxDistance: 25.00,
            spacing: 20.00
        });

        // ── Load and Save Profile Details ──
        const profileForm = document.getElementById('profileForm');
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const phoneInput = document.getElementById('phone');
        const resetBtn = document.getElementById('resetProfileBtn');

        // Load details from localStorage on page load
        if (localStorage.getItem('profileName')) {
            nameInput.value = localStorage.getItem('profileName');
        }
        if (localStorage.getItem('profileEmail')) {
            emailInput.value = localStorage.getItem('profileEmail');
        }
        if (localStorage.getItem('profilePhone')) {
            phoneInput.value = localStorage.getItem('profilePhone');
        }

        // Save details to localStorage on form submit
        profileForm.addEventListener('submit', function(e) {
            e.preventDefault();
            localStorage.setItem('profileName', nameInput.value.trim());
            localStorage.setItem('profileEmail', emailInput.value.trim());
            localStorage.setItem('profilePhone', phoneInput.value.trim());
            alert('Profile saved successfully!');
        });

        // Reset details and remove from localStorage
        resetBtn.addEventListener('click', function() {
            if (confirm('Are you sure you want to reset your profile details?')) {
                nameInput.value = '';
                emailInput.value = '';
                phoneInput.value = '';
                localStorage.removeItem('profileName');
                localStorage.removeItem('profileEmail');
                localStorage.removeItem('profilePhone');
                alert('Profile details reset.');
            }
        });
    </script>

</body>

</html>
